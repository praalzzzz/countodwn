<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s0berz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            width: 100vw;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .countdown {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: clamp(0.5rem, 2vw, 2.5rem);
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .number {
            font-size: clamp(2rem, 13vw, 8.5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: clamp(0.55rem, 1.8vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #737373;
            margin-top: clamp(6px, 1.5vw, 14px);
            font-weight: 600;
        }

        .separator {
            font-size: clamp(1.8rem, 11vw, 7.5rem);
            font-weight: 700;
            color: #333333;
            line-height: 1;
            margin-bottom: clamp(1rem, 3vw, 2rem); /* Align visually with numbers, avoiding label offset */
            flex-shrink: 0;
        }

        .released {
            font-size: clamp(2rem, 9vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            text-transform: lowercase;
            text-align: center;
            width: 100%;
            display: none;
            padding: 0 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="timer" class="countdown">
            <div class="time-block">
                <span id="days" class="number">00</span>
                <span class="label">Days</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <span id="hours" class="number">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <span id="minutes" class="number">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <span id="seconds" class="number">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div id="message" class="released">s0berz out now.</div>
    </div>

    <script>
        // Target date: October 30, 2026 00:00:00
        const targetDate = new Date("October 30, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById("timer").style.display = "none";
                document.getElementById("message").style.display = "block";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, '0');
            document.getElementById("hours").textContent = String(hours).padStart(2, '0');
            document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
            document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
