<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s0berz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 100vw;
            padding: 0 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Countdown Container */
        .countdown-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.5vw;
            width: 100%;
            max-width: 900px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
        }

        .number {
            font-size: clamp(2.2rem, 9vw, 6.5rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
        }

        .colon {
            font-size: clamp(2rem, 7vw, 5rem);
            font-weight: 700;
            color: #333333;
            line-height: 1;
            margin-bottom: 1.2rem;
            user-select: none;
        }

        /* Released State */
        .released-text {
            display: none;
            font-size: clamp(2rem, 8vw, 5.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            text-align: center;
            color: #ffffff;
        }

        /* Mobile specific adjustments to avoid any overflow */
        @media (max-width: 480px) {
            .countdown-grid {
                gap: 0.8vw;
            }
            .colon {
                margin-bottom: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Countdown Container -->
        <div id="countdown" class="countdown-grid">
            <div class="time-unit">
                <span id="days" class="number">00</span>
            </div>
            <div class="colon">:</div>
            <div class="time-unit">
                <span id="hours" class="number">00</span>
            </div>
            <div class="colon">:</div>
            <div class="time-unit">
                <span id="minutes" class="number">00</span>
            </div>
            <div class="colon">:</div>
            <div class="time-unit">
                <span id="seconds" class="number">00</span>
            </div>
        </div>

        <!-- Release Message -->
        <div id="released" class="released-text">s0berz out now.</div>
    </div>

    <script>
        // Target release date: October 30, 2026 at 00:00:00 UTC/Midnight
        const releaseTime = new Date('2026-10-30T00:00:00').getTime();

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownEl = document.getElementById('countdown');
        const releasedEl = document.getElementById('released');

        function updateTimer() {
            const now = new Date().getTime();
            const distance = releaseTime - now;

            if (distance <= 0) {
                countdownEl.style.display = 'none';
                releasedEl.style.display = 'block';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
